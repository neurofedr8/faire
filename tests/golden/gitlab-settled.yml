stages:
- jobs
- tasks
- status
- checks
- merge
- downstream
default:
  image: $FAIRE_IMAGE
  before_script:
  - sh -c "${FAIRE_SETUP:-true}"
  - git fetch -q origin "+refs/heads/$CI_COMMIT_REF_NAME:refs/remotes/origin/$CI_COMMIT_REF_NAME"
  - git checkout -B "$CI_COMMIT_REF_NAME" "refs/remotes/origin/$CI_COMMIT_REF_NAME"
  - git remote set-url origin "$CI_SERVER_URL/$CI_PROJECT_PATH.git"
  - git config --show-origin --name-only --get-regexp '^url\..*\.insteadof$' | while
    read -r where key; do git config --file "${where#file:}" --unset-all "$key"; done
    || true
check-validate:
  stage: checks
  script:
  - faire test --stage collection --check 'validate'
  needs: []
  allow_failure: false
check-summary:
  stage: checks
  script:
  - faire test --stage collection --check 'summary'
  needs: []
  allow_failure: true
mark-missing-physio:
  stage: checks
  script:
  - faire mark 'physio=missing'
  needs: []
  when: manual
  allow_failure: true
merge:
  stage: merge
  script:
  - faire merge
  needs:
  - check-validate
  when: manual
  allow_failure: true
