stages:
- jobs
- tasks
- status
- checks
- merge
- downstream
default:
  image: $FAIRE_IMAGE
  before_script:
  - sh -c "${FAIRE_SETUP:-true}"
  - git fetch -q origin "+refs/heads/$CI_COMMIT_REF_NAME:refs/remotes/origin/$CI_COMMIT_REF_NAME"
  - git checkout -B "$CI_COMMIT_REF_NAME" "refs/remotes/origin/$CI_COMMIT_REF_NAME"
  - git remote set-url origin "$CI_SERVER_URL/$CI_PROJECT_PATH.git"
  - git config --show-origin --name-only --get-regexp '^url\..*\.insteadof$' | while
    read -r where key; do git config --file "${where#file:}" --unset-all "$key"; done
    || true
task-unwarp-s:
  stage: tasks
  script:
  - faire run --task 'unwarp:s'
  needs: []
task-physio-s:
  stage: tasks
  script:
  - faire run --task 'physio:s'
  needs: []
task-deface-s:
  stage: tasks
  script:
  - faire run --task 'deface:s'
  needs:
  - task-unwarp-s
  tags:
  - gpu
status:
  stage: status
  script:
  - faire status --next-wave
  needs:
  - task-unwarp-s
  - task-physio-s
  - task-deface-s
