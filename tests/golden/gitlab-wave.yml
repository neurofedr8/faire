stages:
- jobs
- tasks
- status
- checks
- downstream
default:
  image: $FAIRE_IMAGE
  before_script:
  - git checkout -B "$CI_COMMIT_REF_NAME" "$CI_COMMIT_SHA"
task-unwarp-s:
  stage: tasks
  script:
  - faire run --task 'unwarp:s'
  needs: []
task-physio-s:
  stage: tasks
  script:
  - faire run --task 'physio:s'
  needs: []
task-deface-s:
  stage: tasks
  script:
  - faire run --task 'deface:s'
  needs:
  - task-unwarp-s
  tags:
  - gpu
status:
  stage: status
  script:
  - faire status --next-wave
  needs:
  - task-unwarp-s
  - task-physio-s
  - task-deface-s
