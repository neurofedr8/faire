[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faire"
version = "0.1.0"
description = "Executable research data management from a machine-actionable DMP (RDA DMP Common Standard)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.5.1",
  "datalad>=1.8.0",
  "datalad-container>=1.2.6",
  "datalad-next>=1.6",
  "copier>=9.19.1",
  "jsonschema>=4.26.0",
  "python-gitlab>=8.6.0",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.17.6"]

[project.scripts]
faire = "faire.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs against a live platform (opt-in through environment variables)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
