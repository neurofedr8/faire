# Standard dataset starter, derived from `base`: placeholder rules converting a stream and
# processing the dataset's own output, and two checks. Replace every TODO in
# .datalad/config (images and commands) before publishing a version.
collection_url:
  type: str
  help: Clone URL of the container collection
collection_revision:
  type: str
  help: Tag or commit of the container collection to pin
source:
  type: str
  default: dicoms
  help: Identifier of the stream converted by the `convert` rule
_answers_file: .copier-answers.yml
_exclude: [copier.yml, .git]
