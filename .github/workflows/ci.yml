name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install git-annex
        run: sudo apt-get update && sudo apt-get install -y git-annex
      - name: Start MinIO (S3 store for tests/test_s3_live.py)
        # a step, not a service: service containers cannot pass MinIO its `server` command
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=faire -e MINIO_ROOT_PASSWORD=faire-test-secret \
            minio/minio server /data
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "until mc alias set local http://localhost:9000 faire faire-test-secret; do sleep 1; done \
             && mc mb local/faire-test"
      - name: Install
        run: uv venv && uv pip install -e '.[dev]'
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        env:
          FAIRE_TEST_S3_HOST: localhost
          AWS_ACCESS_KEY_ID: faire
          AWS_SECRET_ACCESS_KEY: faire-test-secret
        run: .venv/bin/pytest -q
